<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="djobba-fav-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="45%" stop-color="#3ECF8E" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="djobba-fav-arrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="djobba-fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3ECF8E" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 100% Transparent Background - Djobba Geometric Monogram & Kinetic Chevron -->
  <g filter="url(#djobba-fav-glow)">
    <!-- Outer "D" Arch & Spine -->
    <path
      d="M30 96V32c0-3.3 2.7-6 6-6h25c19.88 0 36 15.67 36 35s-16.12 35-36 35H36c-3.3 0-6-2.7-6-6z"
      fill="none"
      stroke="url(#djobba-fav-emerald)"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Kinetic Velocity Chevron (Matching & SABI Rails Instant Clearing) -->
    <path
      d="M48 49l16 15-16 15"
      fill="none"
      stroke="url(#djobba-fav-arrow)"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Center Connection Pulse Node -->
    <circle cx="45" cy="64" r="4" fill="#A7F3D0" />
  </g>
</svg>
