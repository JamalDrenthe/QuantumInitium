<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce289" />
      <stop offset="35%" stop-color="#dfa84a" />
      <stop offset="70%" stop-color="#b67a24" />
      <stop offset="100%" stop-color="#eed17d" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a5298" />
      <stop offset="50%" stop-color="#1e3c72" />
      <stop offset="100%" stop-color="#0f2042" />
    </linearGradient>
    <linearGradient id="barBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Buitenste cirkel in diepblauw en goud -->
  <g transform="translate(200, 180)">
    <!-- Blauwe buitenring -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#blueGrad)" stroke-width="14" />
    <!-- Gouden binnenring -->
    <circle cx="0" cy="0" r="118" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.95" />

    <!-- Grafiek pilaren / groei elementen binnenin -->
    <!-- Pilaar 1 (Kort, blauw) -->
    <polygon points="-50,30 -30,15 -30,48 -50,48" fill="url(#barBlue)" />
    <polygon points="-50,30 -30,15 -30,8 -50,22" fill="#60a5fa" />
    
    <!-- Pilaar 2 (Middel, blauw) -->
    <polygon points="-20,2 -2,-12 -2,48 -20,48" fill="url(#barBlue)" />
    <polygon points="-20,2 -2,-12 -2,-20 -20,-6" fill="#93c5fd" />

    <!-- Pilaar 3 (Hoog, goud met piramide) -->
    <polygon points="10,-45 32,-60 32,48 10,48" fill="url(#goldGrad)" />
    <polygon points="10,-45 32,-60 32,-68 10,-53" fill="#fef08a" />
    <!-- Piramide top -->
    <polygon points="21,-88 10,-72 21,-76 32,-72" fill="url(#goldGrad)" />

    <!-- Gouden sierlijke Q curve -->
    <path d="M-60,50 Q10,10 50,-20 Q80,-40 60,-5 C40,30 20,60 90,80 Q40,65 10,50 Q-20,40 -60,50 Z" fill="url(#goldGrad)" />
    
    <!-- Gouden parel onderin -->
    <circle cx="0" cy="62" r="7" fill="url(#goldGrad)" />
  </g>

  <!-- Typografie QUANTUM INITIUM -->
  <text x="200" y="380" font-family="'Plus Jakarta Sans', 'Cinzel', 'Trajan Pro', serif" font-size="34" font-weight="700" letter-spacing="6" fill="#1e3a8a" text-anchor="middle">
    QUANTUM
  </text>
  <text x="200" y="420" font-family="'Plus Jakarta Sans', 'Cinzel', 'Trajan Pro', serif" font-size="28" font-weight="600" letter-spacing="8" fill="url(#goldGrad)" text-anchor="middle">
    INITIUM
  </text>
</svg>
