<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Goud Gradiënten met Hoge Contrast en Heldere Definitie op Wit -->
    <linearGradient id="qiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbd364" />
      <stop offset="25%" stop-color="#e8a838" />
      <stop offset="60%" stop-color="#b87314" />
      <stop offset="85%" stop-color="#8c530d" />
      <stop offset="100%" stop-color="#e29e2e" />
    </linearGradient>

    <linearGradient id="qiGoldLight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="40%" stop-color="#fbd364" />
      <stop offset="100%" stop-color="#c67d16" />
    </linearGradient>

    <linearGradient id="qiGoldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c042" />
      <stop offset="50%" stop-color="#b87314" />
      <stop offset="100%" stop-color="#f5c042" />
    </linearGradient>

    <!-- Krachtige Saffierblauwe Gradiënten voor Maximale Contrast op Wit -->
    <linearGradient id="qiBlueOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="35%" stop-color="#1d4ed8" />
      <stop offset="70%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f2042" />
    </linearGradient>

    <linearGradient id="qiBarBlue1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <linearGradient id="qiBarBlue2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Gouden Bol Radiaal Gradiënt -->
    <radialGradient id="qiSphereGold" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="55%" stop-color="#d97706" />
      <stop offset="85%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>

    <!-- Subtiele Schaduw voor Ruimtelijke Diepte op de Witte Achtergrond -->
    <filter id="qiDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Volledig Vlakke Witte Basis Achtergrond -->
  <rect width="512" height="512" fill="#ffffff" />

  <!-- Subtiele Elegante Goudrand (Luxe FinTech Card Badge) -->
  <rect x="6" y="6" width="500" height="500" rx="108" fill="#ffffff" stroke="url(#qiGoldBorder)" stroke-width="6" />

  <!-- Quantum Initium Embleem Groep (Gecentreerd op 256, 252) -->
  <g transform="translate(256, 250) scale(1.4)" filter="url(#qiDropShadow)">
    <!-- Buitenste Blauwe Spiraalring -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#qiBlueOuter)" stroke-width="16" stroke-linecap="round" />

    <!-- Gouden Binnenring -->
    <circle cx="0" cy="0" r="116" fill="none" stroke="url(#qiGold)" stroke-width="9" />

    <!-- Pilaar 1 (Kort, blauw metallic) -->
    <polygon points="-50,30 -30,15 -30,48 -50,48" fill="url(#qiBarBlue1)" />
    <polygon points="-50,30 -30,15 -30,8 -50,22" fill="#93c5fd" />

    <!-- Pilaar 2 (Middel, blauw metallic) -->
    <polygon points="-20,2 -2,-12 -2,48 -20,48" fill="url(#qiBarBlue2)" />
    <polygon points="-20,2 -2,-12 -2,-20 -20,-6" fill="#bfdbfe" />

    <!-- Pilaar 3 (Hoog, goud obelisk) -->
    <polygon points="10,-45 32,-60 32,48 10,48" fill="url(#qiGold)" />
    <polygon points="10,-45 32,-60 32,-68 10,-53" fill="url(#qiGoldLight)" />
    
    <!-- Piramide Apex / Top van Pilaar 3 -->
    <polygon points="21,-88 10,-72 21,-76 32,-72" fill="url(#qiGold)" />
    <polygon points="21,-88 21,-76 32,-72" fill="url(#qiGoldLight)" />

    <!-- Gouden Sierlijke Q Curve / Dynamische Golf -->
    <path d="M-60,50 Q10,10 50,-20 Q80,-40 60,-5 C40,30 20,60 90,80 Q40,65 10,50 Q-20,40 -60,50 Z" fill="url(#qiGold)" />
    <path d="M-56,48 Q10,12 48,-16 Q72,-32 58,-4 C40,26 22,54 84,74 Q38,61 10,48 Q-18,39 -56,48 Z" fill="url(#qiGoldLight)" opacity="0.65" />

    <!-- Quantum Orb (Gouden Bol / Parel onderin) -->
    <circle cx="0" cy="62" r="14" fill="url(#qiSphereGold)" />
  </g>
</svg>
